<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои финансы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <div><p class="eyebrow">ЛИЧНЫЕ ФИНАНСЫ</p><h1>Мои финансы</h1></div>
      <div class="header-actions">
        <button class="add-button expense-button" id="open-expense">− Добавить трату</button>
        <button class="add-button income-button" id="open-income">+ Добавить прибыль</button>
      </div>
    </header>

    <section class="summaries" aria-label="Итоги за выбранный период">
      <article class="summary expense-summary"><span>Расходы</span><strong id="expense-total">0 ₸</strong><small id="expense-count">0 записей</small></article>
      <article class="summary income-summary"><span>Прибыль</span><strong id="income-total">0 ₸</strong><small id="income-count">0 записей</small></article>
      <article class="summary balance-summary"><span>Чистый результат</span><strong id="balance-total">0 ₸</strong><small>Прибыль − расходы</small></article>
    </section>

    <section class="controls">
      <label class="search"><span>⌕</span><input id="search" placeholder="Поиск по расходам и прибыли" /></label>
      <div class="periods" aria-label="Быстрый выбор периода"><button data-period="month-start">С начала месяца</button><button data-period="week">Неделя</button><button data-period="month">Месяц</button></div>
      <div class="custom-dates"><label>От<input type="date" id="date-from" /></label><label>До<input type="date" id="date-to" /></label><button id="reset">Сбросить</button></div>
    </section>

    <section class="table-card">
      <div class="table-head"><span>Операция</span><span>Дата и время</span><span>Сумма</span><span></span></div>
      <div id="rows"></div>
      <p class="empty" id="empty">Здесь появятся ваши доходы и расходы.</p>
    </section>
  </main>

  <dialog id="transaction-dialog">
    <form id="transaction-form">
      <div class="form-title"><h2 id="form-title">Новая трата</h2><button type="button" class="close" id="close-form" aria-label="Закрыть">×</button></div>
      <label>Сумма, ₸<input name="amount" type="number" min="1" step="0.01" placeholder="Например, 3500" required autofocus /></label>
      <label>Комментарий<input name="comment" maxlength="100" placeholder="Например, продукты или зарплата" required /></label>
      <label>Дата и время<input name="spentAt" id="spent-at" type="datetime-local" step="60" required /></label>
      <p class="hint">Можно выбрать любую дату и время вручную</p>
      <p class="error" id="form-error"></p>
      <button class="save" id="save-transaction" type="submit">Сохранить трату</button>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
